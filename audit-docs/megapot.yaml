# AI Agent Audit Configuration for IndexFun Order Book Contest
# Git repository URL
repo: "https://github.com/code-423n4/2025-11-megapot.git"

# Project is in a subfolder
# subfolder: "orderbook-solidity"

# Custom documentation file (should be in current directory)
custom_doc: "audit-docs/megapot-docs.md"

# Scoped files list (should be in current directory)
scoped_files: "audit-docs/megapot-scope.txt"

# Audit scope documentation (should be in current directory)
audit_scope: "audit-docs/megapot-scope.md"

# Source code folders (required field with default)
# code_folders:
  # - "src"

# Audit Type (Code4rena, Sherlock, etc)
audit_type: "Code4rena" 

# Builder configuration (use PascalCase for enum values)
builder: "Custom"
build_cmd: "yarn install && yarn build"

# Boolean flags (required fields with defaults)
# via_ir: false
# force_rebuild: false

# Optional: Source code folders (defaults to "src")
code_folders:
- "contracts"
#   - "src"

# Optional: Exclude folders from analysis
# exclude_folders:
#   - "test"
#   - "script"

# Optional: PoC configuration
poc_instructions: "audit-docs/megapot-test.md"
poc_template: "audit-docs/megapot-test.spec.ts"
test_folder: "test/poc"

# Optional: Foundry via-ir flag
# via_ir: false

# Optional: Force rebuild even if cached
# force_rebuild: false

